<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>K예술영재 프로젝트 | 링크 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --ink:#1F2124; --ink-2:#3A3D41; --gray:#6A6E73; --faint:#9A9EA3;
    --line:#E6E4DE; --line-2:#F0EEE9; --paper:#FFFFFF; --desk:#F4F3EF;
    --yel:#F2C230; --yel-lt:#FFF4CF; --yel-ink:#6E5200;
    --music:#4F8AC9; --dance:#D0628A; --trad:#D46C3C; --art:#4E9B55; --all:#6A6E73;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.55;color:var(--ink);background:var(--desk);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
  .wrap{width:min(1200px,calc(100% - 48px));margin:0 auto}

  /* ── 머리 ── */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:44px 0 30px;flex-wrap:wrap}
  .brand small{display:block;font-size:14px;font-weight:600;color:var(--gray)}
  .brand h1{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin-top:4px}
  .search{position:relative;width:min(400px,100%)}
  .search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 44px 0 44px;font:inherit;font-size:15px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(242,194,48,.35)}
  .search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gray)}
  .search .key{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--desk)}
  .search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:none;place-items:center;color:var(--gray);font-size:20px;line-height:1}
  .search .clear:hover{background:var(--desk);color:var(--ink)}
  .search.has .clear{display:grid}.search.has .key{display:none}

  /* ── 인덱스 탭 ── */
  .tabs{display:flex;align-items:flex-end;gap:4px;position:relative;z-index:2;overflow-x:auto;scrollbar-width:none;padding-top:6px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;position:relative;display:flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:12px 12px 0 0;
    background:#E9E7E1;color:var(--gray);font-size:16px;font-weight:700;border:1px solid transparent;border-bottom:0;transition:background .15s,color .15s}
  .tab:hover{background:#E1DED7;color:var(--ink)}
  .tab .n{font-size:12.5px;font-weight:700;min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;background:rgba(0,0,0,.06);color:var(--gray);font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--line);height:58px;margin-bottom:-1px}
  .tab[aria-selected="true"]::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:5px;border-radius:12px 12px 0 0;background:var(--yel)}
  .tab[aria-selected="true"] .n{background:var(--ink);color:#fff}
  .tab.zero{opacity:.45}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:36px 40px 40px;position:relative;z-index:1;min-height:420px}
  .panel[hidden]{display:none}
  .panel.enter{animation:enter .22s ease-out}
  @keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.panel.enter{animation:none}}
  .p-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
  .p-head h2{font-size:22px;font-weight:800;letter-spacing:-.015em}
  .p-head p{color:var(--gray);margin-top:4px}

  /* 접근 표시 */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;height:22px;padding:0 9px;border-radius:6px;white-space:nowrap;flex:none}
  .bg-open{background:var(--line-2);color:var(--gray)}
  .bg-code{background:var(--yel-lt);color:var(--yel-ink)}
  .bg-admin{background:var(--ink);color:#fff}
  .bg-closed{background:var(--line-2);color:var(--faint)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--gray);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:7px}

  /* ── 목록형 줄 (사이트·운영) ── */
  .rows{border-top:1px solid var(--ink)}
  .row{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;padding:26px 0;border-bottom:1px dashed #D9D6CE}
  .row:last-child{border-bottom:0}
  .row-h h3{font-size:19px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .row-h .sub{font-size:13px;font-weight:600;color:var(--gray);margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .row-h p{color:var(--gray);font-size:14px;margin-top:8px;max-width:30em}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-content:start}

  .tile{min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;padding:14px 48px 14px 16px;min-height:76px;display:flex;flex-direction:column;justify-content:center;transition:border-color .15s,background .15s}
  .tile:hover{border-color:var(--ink);background:#FFFDF6}
  .tile a.go{position:absolute;inset:0;border-radius:10px}
  .tile .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tile .nm{font-size:16px;font-weight:700}
  .tile .url{font-size:12.5px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .copy{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:1}
  .copy{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
  .copy:hover{background:var(--desk);color:var(--ink)}

  .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--c)}

  /* ── 버튼 ── */
  .btns{display:flex;gap:6px;flex-wrap:nowrap}
  .b{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:700;white-space:nowrap;border:1px solid var(--line);background:var(--paper);transition:background .15s,border-color .15s}
  .b:hover{border-color:var(--ink)}
  .b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .b.pri:hover{background:#000}
  .b.off{color:#C2C2C2;border-style:dashed;cursor:default}
  .b.off:hover{border-color:var(--line)}

  /* ── 워크숍 표 ── */
  .seg{display:inline-flex;background:var(--desk);border-radius:10px;padding:4px;gap:2px;flex-wrap:wrap}
  .seg button{height:34px;padding:0 14px;border-radius:7px;font-size:14px;font-weight:600;color:var(--gray);display:inline-flex;align-items:center;gap:7px}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg .c{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

  .matrix{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  .matrix th,.matrix td{text-align:left;vertical-align:middle}
  .matrix thead th{padding:0 14px 14px;font-size:16px;font-weight:800}
  .matrix thead th .h{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:4px solid var(--c)}
  .matrix thead th:first-child{width:25%}
  .matrix tbody td{padding:12px 14px;border-top:1px solid var(--line-2)}
  .matrix tbody td:first-child{font-weight:700;font-size:15px}
  .matrix tr.grp td{padding:22px 14px 8px;border-top:0;font-size:13px;font-weight:700;color:var(--gray)}
  .matrix tr.grp:first-child td{padding-top:4px}
  .matrix tr.grp td span{display:inline-block;border-bottom:2px solid var(--yel);padding-bottom:2px}
  .matrix .none{color:#D0CEC8}
  .matrix .badge{margin-left:8px;vertical-align:1px}
  .matrix tbody tr:not(.grp):hover td{background:#FBFAF7}
  .matrix .col-off{opacity:.18;pointer-events:none}

  /* 좁은 화면용 워크숍 목록 */
  .wlist{display:none}
  .wf{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .wf-h{display:flex;align-items:center;gap:9px;padding:14px 16px;font-weight:800;font-size:17px;border-top:4px solid var(--c);border-bottom:1px solid var(--line-2)}
  .wf-i{display:flex;align-items:center;gap:10px;padding:11px 16px;min-height:52px}
  .wf-i + .wf-i{border-top:1px solid var(--line-2)}
  .wf-i .nm{flex:1;font-weight:600;font-size:14.5px}

  /* ── 평가회의 ── */
  .mlist{border-top:1px solid var(--ink)}
  .m{display:grid;grid-template-columns:110px 150px minmax(0,1fr) auto;align-items:center;gap:20px;padding:14px 4px;border-bottom:1px solid var(--line-2)}
  .m:hover{background:#FBFAF7}
  .m .d{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums}
  .m .d b{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .m .d span{font-size:13px;color:var(--gray)}
  .m .f{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
  .m .r{font-size:15px;font-weight:600;color:var(--ink-2)}
  .m .yr{display:none}

  .empty{padding:70px 0;text-align:center;color:var(--gray)}
  .empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
  .hide{display:none!important}

  footer{padding:26px 0 48px;color:var(--gray);font-size:13px;line-height:1.7}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:10px;transition:.2s;pointer-events:none;z-index:50}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:980px){
    .row{grid-template-columns:minmax(0,1fr);gap:14px}
    .m{grid-template-columns:92px minmax(0,1fr) auto;grid-template-areas:"d f b" "d r b";gap:2px 16px}
    .m .d{grid-area:d}.m .f{grid-area:f}.m .r{grid-area:r;font-size:14px;color:var(--gray)}.m .btns{grid-area:b}
  }
  @media (max-width:820px){
    .matrix{display:none}.wlist{display:block}
  }
  @media (max-width:640px){
    .wrap{width:calc(100% - 24px)}
    .top{padding:28px 4px 22px}
    .brand h1{font-size:26px}
    .search .key{display:none}
    .tab{height:46px;padding:0 15px;font-size:15px}
    .tab[aria-selected="true"]{height:52px}
    .panel{padding:24px 16px 28px;border-radius:0 0 14px 14px}
    .p-head{margin-bottom:20px}
    .tiles{grid-template-columns:minmax(0,1fr)}
    .m{grid-template-columns:64px minmax(0,1fr);grid-template-areas:"d f" "d r" "d b";gap:2px 12px;padding:14px 2px}
    .m .btns{margin-top:8px}
    .m .d{flex-direction:column;gap:0}
    .m .d b{font-size:18px}
  }
</style>
</head>
<body>

<div class="wrap">

      <input id="q" type="text" enterkeyhint="search" placeholder="자료나 사이트 이름으로 찾기" aria-label="링크 찾기" autocomplete="off">

/* ================================================================

   ================================================================ */
const COLOR = { music:'var(--music)', dance:'var(--dance)', trad:'var(--trad)', art:'var(--art)', all:'var(--all)' };
const FNAME = { music:'음악', dance:'무용', trad:'전통예술', art:'미술', all:'전체 분야' };
const TAG = { open:['bg-open','공개'], code:['bg-code','접근코드'], admin:['bg-admin','관리자'], closed:['bg-closed','마감'] };
const WD = ['일','월','화','수','목','금','토'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = id => 'https://drive.google.com/file/d/' + id + '/view';
const down = id => 'https://drive.google.com/uc?export=download&id=' + id;
const shortUrl = u => u.replace(/^https?:\/\//,'').replace(/\/(edit|view)$/,'').replace(/\/$/,'');
const badge = (t, label) => { const [c,n] = TAG[t] || TAG.open; return `<span class="badge ${c}">${esc(label || n)}</span>`; };
const dot = k => `<i class="dot" style="--c:${COLOR[k]}"></i>`;
const COPY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
const ext = (href, cls, text) => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;

function tile(l, ctx){
  return `<div class="tile" data-s="${esc(ctx + ' ' + l.name + ' ' + l.url + ' ' + (l.label||'') + ' ' + (TAG[l.tag]||TAG.open)[1])}">
    <a class="go" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${esc(l.name)} 열기"></a>
    <div class="t1"><span class="nm">${esc(l.name)}</span>${badge(l.tag, l.label)}</div>
    <span class="url">${esc(shortUrl(l.url))}</span>
    <button class="copy" type="button" data-copy="${esc(l.url)}" aria-label="${esc(l.name)} 주소 복사" title="주소 복사">${COPY}</button>
  </div>`;
}
function rowBlock(head, links, ctx){
  return `<div class="row" data-card><div class="row-h">${head}</div><div class="tiles">${links.map(l => tile(l, ctx)).join('')}</div></div>`;
}
const legend = `<div class="legend"><span>${badge('open')}누구나</span><span>${badge('code')}코드·로그인 필요</span><span>${badge('admin')}관리자만</span></div>`;

/* 1. 사이트 */
const pSites = `

  <div class="rows">${SITES.map(s => rowBlock(
    `<p class="sub">${esc(s.sub)}</p><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>`, s.links, s.sub + ' ' + s.title)).join('')}</div>`;

/* 2. 워크숍 자료 */
function cell(it, k){
  const v = it.v[k];
  if(!v) return '<span class="none">—</span>';
  return it.type === 'web'
    ? `<span class="btns">${ext(v,'b pri','열기')}</span>`
    : `<span class="btns">${ext(view(v),'b pri','보기')}${ext(down(v),'b','받기')}</span>`;
}
const wsCount = k => WORKSHOP.reduce((a,g) => a + g.items.filter(it => it.v[k]).length, 0);
const wsTotal = FIELDS.reduce((a,f) => a + wsCount(f.key), 0);
const segBtns = (id, counter) => `<div class="seg" data-seg="${id}" role="group" aria-label="분야 고르기">
  <button type="button" data-k="all" aria-pressed="true">전체</button>
  ${FIELDS.map(f => `<button type="button" data-k="${f.key}" aria-pressed="false">${dot(f.key)}${esc(f.name)}<span class="c">${counter(f.key)}</span></button>`).join('')}</div>`;

const pWorkshop = `
  <div class="p-head"><div><h2>워크숍 자료</h2><p>분야별 리플렛과 만족도 조사·분석 보고서입니다.</p></div>${segBtns('ws', wsCount)}</div>
  <table class="matrix">
    <thead><tr><th><span class="h" style="--c:transparent">자료</span></th>${FIELDS.map(f => `<th data-col="${f.key}"><span class="h" style="--c:${COLOR[f.key]}">${dot(f.key)}${esc(f.name)}</span></th>`).join('')}</tr></thead>
    <tbody>${WORKSHOP.map(g => `<tr class="grp" data-grp><td colspan="5"><span>${esc(g.group)}</span></td></tr>` +
      g.items.map(it => `<tr data-s="${esc(g.group + ' ' + it.name + ' ' + (it.status||'') + ' ' + FIELDS.filter(f => it.v[f.key]).map(f => f.name).join(' '))}" data-fs="${FIELDS.filter(f => it.v[f.key]).map(f => f.key).join(' ')}">
        <td>${esc(it.name)}${it.status ? badge('closed', it.status) : ''}</td>
        ${FIELDS.map(f => `<td data-col="${f.key}">${cell(it, f.key)}</td>`).join('')}</tr>`).join('')).join('')}</tbody>
  </table>
  <div class="wlist">${FIELDS.map(f => `<div class="wf" data-f="${f.key}" data-card style="--c:${COLOR[f.key]}">
      <div class="wf-h">${dot(f.key)}${esc(f.name)}</div>
      ${WORKSHOP.flatMap(g => g.items.filter(it => it.v[f.key]).map(it => `<div class="wf-i" data-s="${esc(f.name + ' ' + g.group + ' ' + it.name + ' ' + (it.status||''))}">
        <span class="nm">${esc(it.name)}${it.status ? ' ' + badge('closed', it.status) : ''}</span>${cell(it, f.key)}</div>`)).join('')}
    </div>`).join('')}</div>`;

/* 3. 평가회의 */
const mCount = k => MEETINGS.filter(m => m.f === k).length;
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return { md:`${m}.${d}`, wd:WD[new Date(y,m-1,d).getDay()] }; };
const pMeet = `

  <div class="mlist">${MEETINGS.map(m => { const d = fmt(m.date); return `

      <span class="d"><b>${d.md}</b><span>${d.wd}요일</span></span>
      <span class="f">${dot(m.f)}${esc(FNAME[m.f])}</span>

      <span class="btns">${m.doc ? ext(m.doc,'b pri','회의록') : '<span class="b off" aria-label="회의록 없음">회의록 없음</span>'}${ext(view(m.rec),'b','녹취 듣기')}</span>
    </div>`; }).join('')}</div>`;

/* 4. 운영 페이지 */
const opsTotal = OPS.reduce((a,o) => a + o.links.length, 0);
const pOps = `
  <div class="p-head"><div><h2>운영 페이지</h2><p>심화 멘토링·신청·업무보고에 쓰는 페이지입니다.</p></div>${legend}</div>
  <div class="rows">${OPS.map(o => rowBlock(
    `<p class="sub">${dot(o.f)}${esc(FNAME[o.f])}</p><h3>${esc(o.title)}</h3><p>${esc(o.desc)}</p>`, o.links, FNAME[o.f] + ' ' + o.title)).join('')}</div>`;

const TABS = [
  { id:'sites',    name:'사이트·관리자', html:pSites },
  { id:'workshop', name:'워크숍 자료',   html:pWorkshop },
  { id:'meetings', name:'평가회의 자료', html:pMeet },
  { id:'ops',      name:'운영 페이지',   html:pOps },
];
document.getElementById('tabs').innerHTML = TABS.map(t =>
  `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="p-${t.id}" aria-selected="false" data-tab="${t.id}">${esc(t.name)}<span class="n" data-n="${t.id}">0</span></button>`).join('');
document.getElementById('panels').innerHTML = TABS.map(t =>
  `<section class="panel" role="tabpanel" id="p-${t.id}" aria-labelledby="tab-${t.id}" hidden>${t.html}
     <div class="empty hide" data-empty><b>찾는 링크가 없습니다</b>검색어를 바꾸거나 다른 탭을 확인해 주세요.</div></section>`).join('');

/* ── 상태 ── */
let CUR = 'sites';
const SEG = { ws:'all', mt:'all' };
const q = document.getElementById('q');
const norm = s => s.toLowerCase().replace(/\s+/g,'');

function filter(){
  const term = norm(q.value);
  document.getElementById('searchBox').classList.toggle('has', !!q.value);
  const counts = {};
  TABS.forEach(t => {
    const p = document.getElementById('p-' + t.id);
    let n = 0;
    if(t.id === 'workshop'){
      const k = SEG.ws;
      // 표
      p.querySelectorAll('.matrix tbody tr[data-s]').forEach(tr => {
        const ok = (k === 'all' || tr.dataset.fs.split(' ').includes(k)) && (!term || norm(tr.dataset.s + ' ' + tr.textContent).includes(term));
        tr.classList.toggle('hide', !ok);
      });
      p.querySelectorAll('.matrix tr.grp').forEach(g => {
        let el = g.nextElementSibling, any = false;
        while(el && !el.classList.contains('grp')){ if(!el.classList.contains('hide')) any = true; el = el.nextElementSibling; }
        g.classList.toggle('hide', !any);
      });
      p.querySelectorAll('.matrix [data-col]').forEach(c => c.classList.toggle('col-off', k !== 'all' && c.dataset.col !== k));
      // 좁은 화면 목록 (건수 세기 기준)
      p.querySelectorAll('.wf').forEach(card => {
        let h = 0;
        card.querySelectorAll('[data-s]').forEach(el => {
          const ok = (k === 'all' || card.dataset.f === k) && (!term || norm(el.dataset.s).includes(term));
          el.classList.toggle('hide', !ok); if(ok) h++;
        });
        card.classList.toggle('hide', !h); n += h;
      });
    } else if(t.id === 'meetings'){
      const k = SEG.mt;
      p.querySelectorAll('.m').forEach(el => {
        const ok = (k === 'all' || el.dataset.f === k || el.dataset.f === 'all') && (!term || norm(el.dataset.s).includes(term));
        el.classList.toggle('hide', !ok); if(ok) n++;
      });
    } else {
      p.querySelectorAll('[data-card]').forEach(card => {
        let h = 0;
        card.querySelectorAll('[data-s]').forEach(el => {
          const ok = !term || norm(el.dataset.s + ' ' + card.querySelector('.row-h').textContent).includes(term);
          el.classList.toggle('hide', !ok); if(ok) h++;
        });
        card.classList.toggle('hide', !h); n += h;
      });
    }
    p.querySelector('[data-empty]').classList.toggle('hide', n > 0);
    counts[t.id] = n;
    const badgeEl = document.querySelector(`[data-n="${t.id}"]`);
    badgeEl.textContent = n;
    badgeEl.parentElement.classList.toggle('zero', !!term && n === 0);
  });
  // 검색 중 지금 탭에 결과가 없으면 결과가 있는 첫 탭으로
  if(term && !counts[CUR]){
    const first = TABS.find(t => counts[t.id]);
    if(first) show(first.id, false);
  }
}

function show(id, focus){
  if(!TABS.some(t => t.id === id)) id = 'sites';
  CUR = id;
  TABS.forEach(t => {
    const on = t.id === id;
    const tab = document.getElementById('tab-' + t.id);
    tab.setAttribute('aria-selected', on);
    tab.tabIndex = on ? 0 : -1;
    const p = document.getElementById('p-' + t.id);
    if(on && p.hidden){ p.hidden = false; p.classList.remove('enter'); void p.offsetWidth; p.classList.add('enter'); }
    else if(!on) p.hidden = true;
  });
  if(location.hash !== '#' + id){ try{ history.replaceState(null, '', '#' + id); }catch(e){ } }
  if(focus) document.getElementById('tab-' + id).focus();
  document.getElementById('tab-' + id).scrollIntoView({ block:'nearest', inline:'nearest' });
}

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if(t) show(t.dataset.tab, false);
});
document.getElementById('tabs').addEventListener('keydown', e => {
  const i = TABS.findIndex(t => t.id === CUR);
  if(e.key === 'ArrowRight'){ e.preventDefault(); show(TABS[(i+1) % TABS.length].id, true); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); show(TABS[(i-1+TABS.length) % TABS.length].id, true); }
});
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));

document.addEventListener('click', e => {
  const b = e.target.closest('.seg button'); if(!b) return;
  const seg = b.closest('.seg');
  SEG[seg.dataset.seg] = b.dataset.k;
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  filter();
});

q.addEventListener('input', filter);
document.getElementById('clear').addEventListener('click', () => { q.value = ''; filter(); q.focus(); });
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape' && document.activeElement === q){ q.value = ''; filter(); }
});

/* 주소 복사 */
const toast = document.getElementById('toast'); let tt;
function say(m){ toast.textContent = m; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if(!b) return;
  e.preventDefault();
  const url = b.dataset.copy;
  try{ await navigator.clipboard.writeText(url); say('주소를 복사했습니다'); }
  catch(err){
    const t = document.createElement('textarea'); t.value = url; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(e2){} t.remove();
    say(ok ? '주소를 복사했습니다' : '복사하지 못했습니다. 주소를 길게 눌러 복사해 주세요');
  }
});

show(location.hash.slice(1) || 'sites', false);
filter();
</script>
