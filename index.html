<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#202226">
<title>K예술영재 프로젝트 운영 Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202226'/%3E%3Crect x='6' y='22' width='5' height='4' fill='%234F8AC9'/%3E%3Crect x='11' y='22' width='5' height='4' fill='%23D0628A'/%3E%3Crect x='16' y='22' width='5' height='4' fill='%23D46C3C'/%3E%3Crect x='21' y='22' width='5' height='4' fill='%234E9B55'/%3E%3Ctext x='16' y='18' font-family='sans-serif' font-size='13' font-weight='800' fill='%23F2C230' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --ink:#202226; --ink-2:#3A3D42; --gray:#686C72; --faint:#9A9EA4;
    --line:#E6E3DC; --line-2:#F0EEE8; --paper:#FFFFFF; --desk:#F4F2EE;
    --band:#202226; --band-2:#2C2F34; --band-tx:#F3F1EC; --band-soft:#A8ABB0;
    --yel:#F2C230; --yel-lt:#FFF4CF; --yel-ink:#6E5200;
    --music:#4F8AC9; --dance:#D0628A; --trad:#D46C3C; --art:#4E9B55; --all:#7B7F85;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.55;color:var(--ink);background:var(--desk);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--yel);outline-offset:2px;border-radius:6px}
  .wrap{width:min(1200px,calc(100% - 48px));margin:0 auto}

  /* ── 분야 색 띠 (책 옆면 인덱스) ── */
  .edge{display:grid;grid-template-columns:repeat(4,1fr);height:6px}
  .edge i:nth-child(1){background:var(--music)}.edge i:nth-child(2){background:var(--dance)}
  .edge i:nth-child(3){background:var(--trad)}.edge i:nth-child(4){background:var(--art)}

  /* ── 머리 띠 ── */
  .band{background:var(--band);color:var(--band-tx)}
  .band-top{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;padding:44px 0 0;flex-wrap:wrap}
  .ttl{display:flex;align-items:center;gap:18px}
  .mark{flex:none;width:56px;height:56px;border-radius:14px;background:var(--band-2);display:grid;place-items:center;position:relative;overflow:hidden}
  .mark b{font-size:24px;font-weight:900;color:var(--yel);letter-spacing:-.04em;margin-top:-6px}
  .mark span{position:absolute;left:0;right:0;bottom:0;height:7px;display:grid;grid-template-columns:repeat(4,1fr)}
  .mark span i:nth-child(1){background:var(--music)}.mark span i:nth-child(2){background:var(--dance)}
  .mark span i:nth-child(3){background:var(--trad)}.mark span i:nth-child(4){background:var(--art)}
  .ttl h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
  .ttl h1 em{font-style:normal;color:var(--yel);font-weight:900;letter-spacing:-.01em}
  .ttl p{color:var(--band-soft);font-size:14.5px;margin-top:6px}

  .search{position:relative;width:min(380px,100%);margin-top:6px}
  .search input{width:100%;height:48px;border:1px solid #3B3E44;border-radius:12px;background:var(--band-2);padding:0 44px;font:inherit;font-size:15px;color:var(--band-tx);transition:border-color .15s,background .15s}
  .search input::placeholder{color:#8C9096}
  .search input:focus{outline:none;border-color:var(--yel);background:#33363C}
  .search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#8C9096}
  .search .key{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:#8C9096;border:1px solid #474A50;border-radius:6px;padding:1px 7px}
  .search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:none;place-items:center;color:var(--band-soft);font-size:20px;line-height:1}
  .search .clear:hover{background:#3B3E44;color:#fff}
  .search.has .clear{display:grid}.search.has .key{display:none}

  /* 바로가기 */
  .quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:34px}
  .q .go{position:absolute;inset:0;border-radius:12px}
  .q{position:relative;display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:12px;background:var(--band-2);border:1px solid transparent;transition:border-color .15s,background .15s;min-width:0}
  .q:hover{border-color:#4A4D53;background:#33363C}
  .q .qi{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#3A3D43;color:var(--yel)}
  .q .qt{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start}
  .q .qt > b{display:block;font-size:15.5px;font-weight:700}
  .q .qt > span:not(.code){display:block;font-size:12.5px;color:var(--band-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q svg.out{margin-left:auto;flex:none;color:#7C8086}
  .q:hover svg.out{color:var(--yel)}
  .quick-l{font-size:13px;font-weight:600;color:var(--band-soft);margin-top:30px}
  .quick-l + .quick{margin-top:10px}

  /* ── 탭 (띠 아래에 매달림) ── */
  .tabs{display:flex;align-items:flex-end;gap:4px;margin-top:34px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;position:relative;display:flex;align-items:center;gap:10px;height:50px;padding:0 22px;border-radius:12px 12px 0 0;
    background:rgba(255,255,255,.06);color:var(--band-soft);font-size:16px;font-weight:700;transition:background .15s,color .15s}
  .tab:hover{background:rgba(255,255,255,.11);color:#fff}
  .tab .n{font-size:12.5px;font-weight:700;min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{background:var(--paper);color:var(--ink);height:56px}
  .tab[aria-selected="true"]::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:12px 12px 0 0;background:var(--yel)}
  .tab[aria-selected="true"] .n{background:var(--ink);color:#fff}
  .tab.zero{opacity:.4}

  /* ── 판 ── */
  .panel{background:var(--paper);border-radius:0 0 16px 16px;padding:38px 40px 44px;min-height:440px;box-shadow:0 1px 0 var(--line)}
  .panel[hidden]{display:none}
  .panel.enter{animation:enter .22s ease-out}
  @keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.panel.enter{animation:none}}
  .p-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .p-head h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
  .p-head p{color:var(--gray);margin-top:4px}

  .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;height:22px;padding:0 8px;border-radius:6px;white-space:nowrap;flex:none}
  .bg-open{background:var(--line-2);color:var(--gray)}
  .bg-code{background:var(--yel-lt);color:var(--yel-ink)}
  .bg-admin{background:var(--ink);color:#fff}
  .bg-closed{background:var(--line-2);color:var(--faint)}
  .legend{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--gray);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend .ti{width:24px;height:24px;border-radius:7px}
  .legend .ti svg{width:13px;height:13px}

  /* ── 목록형 줄 ── */
  .rows{border-top:2px solid var(--ink)}
  .row{display:grid;grid-template-columns:290px minmax(0,1fr);gap:36px;padding:28px 0;border-bottom:1px dashed #D8D5CC}
  .row:last-child{border-bottom:0;padding-bottom:4px}
  .row-h .sub{font-size:13px;font-weight:600;color:var(--gray);display:flex;align-items:center;gap:7px}
  .row-h h3{font-size:19px;font-weight:800;letter-spacing:-.015em;margin-top:3px}
  .row-h p{color:var(--gray);font-size:14px;margin-top:8px;max-width:30em}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-content:start}

  .tile{min-width:0;position:relative;display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 50px 14px 14px;min-height:74px;transition:border-color .15s,background .15s,box-shadow .15s}
  .tile:hover{border-color:var(--ink);background:#FFFDF7;box-shadow:0 2px 0 var(--ink)}
  .tile a.go{position:absolute;inset:0;border-radius:12px}
  .ti{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
  .ti-open{background:var(--line-2);color:var(--gray)}
  .ti-code{background:var(--yel-lt);color:var(--yel-ink)}
  .ti-admin{background:var(--ink);color:var(--yel)}
  .ti-closed{background:var(--line-2);color:var(--faint)}
  .tile .tx{min-width:0;flex:1}
  .tile .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tile .nm{font-size:16px;font-weight:700}
  .tile .url{display:block;font-size:12.5px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:9px;padding:4px 4px 4px 10px;border-radius:8px;background:var(--yel-lt);max-width:100%}
  .code .ck{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--yel-ink);white-space:nowrap}
  .code b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
  .cbtn{flex:none;height:24px;padding:0 9px;border-radius:6px;background:var(--paper);font-size:12px;font-weight:700;color:var(--ink);border:1px solid rgba(110,82,0,.18)}
  .cbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .code.dk{background:rgba(242,194,48,.14);margin-top:6px;padding:3px 3px 3px 7px;gap:6px}
  .code.dk b{font-size:12px;letter-spacing:0}
  .code.dk .ck svg{width:12px;height:12px}
  .code.dk .cbtn{height:22px;padding:0 8px}
  .code.dk .ck{color:var(--yel)}
  .code.dk b{color:#fff}
  .code.dk .cbtn{background:transparent;color:var(--band-tx);border-color:rgba(255,255,255,.22)}
  .code.dk .cbtn:hover{background:var(--yel);color:var(--ink);border-color:var(--yel)}
  .tile .copy{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:1}
  .copy{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
  .copy:hover{background:var(--desk);color:var(--ink)}

  .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--c)}

  .btns{display:flex;gap:6px}
  .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:700;white-space:nowrap;border:1px solid var(--line);background:var(--paper);transition:background .15s,border-color .15s}
  .b:hover{border-color:var(--ink)}
  .b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .b.pri:hover{background:#000}
  .b.off{color:#C4C4C4;border-style:dashed;cursor:default}
  .b.off:hover{border-color:var(--line)}
  .b svg{width:14px;height:14px}

  /* ── 분야 고르기 ── */
  .seg{display:inline-flex;background:var(--desk);border-radius:10px;padding:4px;gap:2px;flex-wrap:wrap}
  .seg button{height:34px;padding:0 13px;border-radius:7px;font-size:14px;font-weight:600;color:var(--gray);display:inline-flex;align-items:center;gap:7px}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .seg .c{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* ── 워크숍 표 ── */
  .matrix{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  .matrix th,.matrix td{text-align:left;vertical-align:middle}
  .matrix thead th{padding:0 6px 10px;font-weight:800}
  .matrix thead th:first-child{width:25%;padding-left:0}
  .matrix thead .h{display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;border-radius:10px;font-size:15.5px;background:color-mix(in srgb,var(--c) 11%,#fff);color:var(--ink)}
  .matrix thead th:first-child .h{background:none;padding-left:14px;color:var(--gray);font-size:13px;font-weight:700}
  .matrix tbody td{padding:12px 20px;border-top:1px solid var(--line-2)}
  .matrix tbody td:first-child{padding-left:14px;font-weight:700;font-size:15px}
  .matrix tr.grp td{padding:22px 14px 8px;border-top:0}
  .matrix tr.grp:first-child td{padding-top:8px}
  .matrix tr.grp td span{font-size:13px;font-weight:700;color:var(--gray);display:inline-flex;align-items:center;gap:7px}
  .matrix tr.grp td span::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--yel)}
  .matrix .none{color:#D3D0C9}
  .matrix .badge{margin-left:8px;vertical-align:1px}
  .matrix tbody tr:not(.grp):hover td{background:#FBFAF6}
  .matrix .col-off{opacity:.16;pointer-events:none}

  .wlist{display:none}
  .wf{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .wf-h{display:flex;align-items:center;gap:9px;padding:14px 16px;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--c) 11%,#fff)}
  .wf-i{display:flex;align-items:center;gap:10px;padding:11px 16px;min-height:52px}
  .wf-i + .wf-i{border-top:1px solid var(--line-2)}
  .wf-i .nm{flex:1;font-weight:600;font-size:14.5px}

  /* ── 평가회의 ── */
  .mon{display:flex;align-items:baseline;gap:10px;padding:22px 4px 10px;border-bottom:2px solid var(--ink)}
  .mgrp:first-of-type .mon{padding-top:0}
  .mgrp + .mgrp .mon{padding-top:34px}
  .mon b{font-size:18px;font-weight:800}
  .mon span{font-size:13px;color:var(--faint)}
  .m{display:grid;grid-template-columns:96px 150px minmax(0,1fr) auto;align-items:center;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line-2)}
  .m:hover{background:#FBFAF6}
  .m .d{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
  .m .d b{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .m .d span{font-size:13px;color:var(--gray)}
  .m .f{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
  .m .r{font-size:15px;font-weight:600;color:var(--ink-2)}

  .empty{padding:70px 0;text-align:center;color:var(--gray)}
  .empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
  .hide{display:none!important}

  footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 4px 52px;color:var(--gray);font-size:13px;line-height:1.7}
  footer b{color:var(--ink-2);font-weight:700}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:10px;transition:.2s;pointer-events:none;z-index:50;display:flex;align-items:center;gap:8px}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast svg{color:var(--yel)}

  @media (max-width:1060px){ .quick{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:980px){
    .row{grid-template-columns:minmax(0,1fr);gap:14px}
    .m{grid-template-columns:84px minmax(0,1fr) auto;grid-template-areas:"d f b" "d r b";gap:2px 16px}
    .m .d{grid-area:d}.m .f{grid-area:f}.m .r{grid-area:r;font-size:14px;color:var(--gray)}.m .btns{grid-area:b}
  }
  @media (max-width:820px){ .matrix{display:none}.wlist{display:block} }
  @media (max-width:640px){
    .wrap{width:calc(100% - 24px)}
    .band-top{padding-top:28px;gap:20px}
    .ttl{gap:14px}
    .mark{width:46px;height:46px;border-radius:12px}.mark b{font-size:20px}
    .ttl h1{font-size:25px}
    .ttl p{font-size:13.5px}
    .search{width:100%}
    .search .key{display:none}
    .quick-l{margin-top:24px}
    .quick{gap:8px}
    .q{padding:12px;gap:10px}.q .qi{width:32px;height:32px}.q svg.out{display:none}
    .quick{grid-template-columns:minmax(0,1fr)}
    .q{padding:10px 12px;min-height:54px}
    .q .qt{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
    .q .qt > b{font-size:15px}.q .qt > span:not(.code){display:none}
    .q .code.dk{margin-top:0}
    .tabs{margin-top:26px}
    .tab{height:44px;padding:0 15px;font-size:15px}
    .tab[aria-selected="true"]{height:50px}
    .panel{padding:24px 16px 30px}
    .tiles{grid-template-columns:minmax(0,1fr)}
    .m{grid-template-columns:58px minmax(0,1fr);grid-template-areas:"d f" "d r" "d b";gap:2px 12px;padding:14px 2px}
    .m .btns{margin-top:8px}
    .m .d{flex-direction:column;gap:0}.m .d b{font-size:18px}
  }
</style>
</head>
<body>

<div class="edge" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="ttl">
        <div class="mark" aria-hidden="true"><b>K</b><span><i></i><i></i><i></i><i></i></span></div>
        <div>
          <h1>K예술영재 프로젝트 운영 <em>Hub</em></h1>
          <p>운영에 쓰는 사이트·관리 화면·자료를 한 곳에서 엽니다.</p>
        </div>
      </div>
      <div class="search" id="searchBox">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" enterkeyhint="search" placeholder="자료나 사이트 이름으로 찾기" aria-label="링크 찾기" autocomplete="off">
        <span class="key" aria-hidden="true">/</span>
        <button class="clear" id="clear" type="button" aria-label="검색어 지우기">×</button>
      </div>
    </div>
    <p class="quick-l">자주 여는 곳</p>
    <div class="quick" id="quick"></div>
    <nav class="tabs" role="tablist" aria-label="자료 구분" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <main id="panels"></main>
  <footer>
    <span>워크숍·평가회의 자료는 「K예술영재 프로젝트 워크샵 아카이브」 시트의 <b>2026년 11월 4일</b> 내용입니다.</span>
    <span>관리자·아카이빙 주소가 담겨 있으니 운영진 안에서만 공유해 주세요.</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

const badge = (t, label) => { const [c,n] = TAG[t] || TAG.open; return `<span class="badge bg-${c}">${esc(label || n)}</span>`; };
const ticon = t => { const c = (TAG[t] || TAG.open)[0]; return `<span class="ti ti-${c}">${svg(IC[c], 18, 2)}</span>`; };
const dot = k => `<i class="dot" style="--c:${COLOR[k]}"></i>`;
const ext = (href, cls, inner) => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>`;

document.getElementById('quick').innerHTML = QUICK.map(x => `
  <div class="q">
    <a class="go" href="${esc(x.url)}" target="_blank" rel="noopener" aria-label="${esc(x.name)} 열기"></a>
    <span class="qi">${svg(IC[x.icon], 19, 2)}</span>
    <span class="qt"><b>${esc(x.name)}</b><span>${esc(shortUrl(x.url))}</span>${codeRow(x.code, true)}</span>
    ${svg(IC.out, 16, 2.2).replace('<svg', '<svg class="out"')}
  </div>`).join('');

function codeRow(code, dark){
  if(!code) return '';
  return `<span class="code${dark ? ' dk' : ''}"><span class="ck" title="접근코드">${svg(IC.code, 13, 2.2)}${dark ? '' : '접근코드'}</span><b>${esc(code)}</b>`
    + `<button class="cbtn" type="button" data-copy="${esc(code)}" data-what="code" aria-label="접근코드 ${esc(code)} 복사">복사</button></span>`;
}
function tile(l, ctx){
  return `<div class="tile" data-s="${esc(ctx + ' ' + l.name + ' ' + l.url + ' ' + (l.label||'') + ' ' + (TAG[l.tag]||TAG.open)[1])}">
    <a class="go" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${esc(l.name)} 열기"></a>
    ${ticon(l.tag)}
    <span class="tx"><span class="t1"><span class="nm">${esc(l.name)}</span>${badge(l.tag, l.label)}</span>
    <span class="url">${esc(shortUrl(l.url))}</span>${codeRow(l.code)}</span>
    <button class="copy" type="button" data-copy="${esc(l.url)}" aria-label="${esc(l.name)} 주소 복사" title="주소 복사">${svg(IC.copy, 16)}</button>
  </div>`;
}
const rowBlock = (head, links, ctx) =>
  `<div class="row" data-card><div class="row-h">${head}</div><div class="tiles">${links.map(l => tile(l, ctx)).join('')}</div></div>`;
const legend = `<div class="legend">${['open','code','admin'].map((t,i) =>

function cell(it, k){
  const v = it.v[k];
  if(!v) return '<span class="none">—</span>';
  return it.type === 'web'
    ? `<span class="btns">${ext(v,'b pri','열기')}</span>`
    : `<span class="btns">${ext(view(v),'b pri','보기')}${ext(down(v),'b', svg(IC.down,14,2.2) + '받기')}</span>`;
}

  ${FIELDS.map(f => `<button type="button" data-k="${f.key}" aria-pressed="false">${dot(f.key)}${esc(f.name)}<span class="c">${counter(f.key)}</span></button>`).join('')}</div>`;

  <div class="wlist">${FIELDS.map(f => `<div class="wf" data-f="${f.key}" style="--c:${COLOR[f.key]}">
      <div class="wf-h">${dot(f.key)}${esc(f.name)}</div>
      ${WORKSHOP.flatMap(g => g.items.filter(it => it.v[f.key]).map(it => `<div class="wf-i" data-s="${esc(f.name + ' ' + g.group + ' ' + it.name + ' ' + (it.status||''))}">
        <span class="nm">${esc(it.name)}${it.status ? ' ' + badge('closed', it.status) : ''}</span>${cell(it, f.key)}</div>`)).join('')}
    </div>`).join('')}</div>`;

/* 3. 평가회의 자료 (월별) */
const mCount = k => MEETINGS.filter(m => m.f === k).length;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return { y, m, d, wd:WD[new Date(y,m-1,d).getDay()] }; };
const months = [...new Set(MEETINGS.map(m => m.date.slice(0,7)))].sort();
const pMeet = `
  <div class="p-head"><div><h2>평가회의 자료</h2><p>워크숍 교강사 평가회의의 회의록과 녹취를 날짜순으로 모았습니다.</p></div>${segBtns('mt', mCount)}</div>
  ${months.map(ym => { const list = MEETINGS.filter(m => m.date.startsWith(ym)).sort((a,b) => a.date.localeCompare(b.date)); const [y,mm] = ym.split('-').map(Number);
    return `<div class="mgrp" data-mgrp><div class="mon"><b>${mm}월</b><span>${y}년</span></div>${list.map(m => { const d = parse(m.date); return `
      <div class="m" data-f="${m.f}" data-s="${esc(FNAME[m.f] + ' ' + m.round + ' ' + d.m + '월 ' + d.m + '.' + d.d + ' 회의록 녹취 평가회의')}">
        <span class="d"><b>${d.m}.${d.d}</b><span>${d.wd}요일</span></span>
        <span class="f">${dot(m.f)}${esc(FNAME[m.f])}</span>
        <span class="r">${esc(m.round)}</span>
        <span class="btns">${m.doc ? ext(m.doc,'b pri', svg(IC.doc,14,2.2) + '회의록') : '<span class="b off">회의록 없음</span>'}${ext(view(m.rec),'b', svg(IC.audio,14,2.2) + '녹취')}</span>
      </div>`; }).join('')}</div>`; }).join('')}`;

/* 4. 운영 페이지 */
const pOps = `
  <div class="p-head"><div><h2>운영 페이지</h2><p>심화 멘토링·신청·업무보고에 쓰는 페이지입니다.</p></div>${legend}</div>
  <div class="rows">${OPS.map(o => rowBlock(
    `<p class="sub">${dot(o.f)}${esc(FNAME[o.f])}</p><h3>${esc(o.title)}</h3><p>${esc(o.desc)}</p>`, o.links, FNAME[o.f] + ' ' + o.title)).join('')}</div>`;

const TABS = [
  { id:'sites',    name:'사이트·관리자', html:pSites },
  { id:'workshop', name:'워크숍 자료',   html:pWorkshop },
  { id:'meetings', name:'평가회의 자료', html:pMeet },
  { id:'ops',      name:'운영 페이지',   html:pOps },
];
document.getElementById('tabs').innerHTML = TABS.map(t =>
  `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="p-${t.id}" aria-selected="false" data-tab="${t.id}">${esc(t.name)}<span class="n" data-n="${t.id}">0</span></button>`).join('');
document.getElementById('panels').innerHTML = TABS.map(t =>
  `<section class="panel" role="tabpanel" id="p-${t.id}" aria-labelledby="tab-${t.id}" hidden>${t.html}
     <div class="empty hide" data-empty><b>찾는 링크가 없습니다</b>검색어를 바꾸거나 다른 탭을 확인해 주세요.</div></section>`).join('');

/* ── 거르기 ── */
let CUR = 'sites';
const SEG = { ws:'all', mt:'all' };
const q = document.getElementById('q');
const norm = s => s.toLowerCase().replace(/\s+/g,'');

function filter(){
  const term = norm(q.value);
  document.getElementById('searchBox').classList.toggle('has', !!q.value);
  const counts = {};
  TABS.forEach(t => {
    const p = document.getElementById('p-' + t.id);
    let n = 0;
    if(t.id === 'workshop'){
      const k = SEG.ws;
      p.querySelectorAll('.matrix tbody tr[data-s]').forEach(tr => {
        const ok = (k === 'all' || tr.dataset.fs.split(' ').includes(k)) && (!term || norm(tr.dataset.s).includes(term));
        tr.classList.toggle('hide', !ok);
      });
      p.querySelectorAll('.matrix tr.grp').forEach(g => {
        let el = g.nextElementSibling, any = false;
        while(el && !el.classList.contains('grp')){ if(!el.classList.contains('hide')) any = true; el = el.nextElementSibling; }
        g.classList.toggle('hide', !any);
      });
      p.querySelectorAll('.matrix [data-col]').forEach(c => c.classList.toggle('col-off', k !== 'all' && c.dataset.col !== k));
      p.querySelectorAll('.wf').forEach(card => {
        let h = 0;
        card.querySelectorAll('[data-s]').forEach(el => {
          const ok = (k === 'all' || card.dataset.f === k) && (!term || norm(el.dataset.s).includes(term));
          el.classList.toggle('hide', !ok); if(ok) h++;
        });
        card.classList.toggle('hide', !h); n += h;
      });
    } else if(t.id === 'meetings'){
      const k = SEG.mt;
      p.querySelectorAll('[data-mgrp]').forEach(g => {
        let h = 0;
        g.querySelectorAll('.m').forEach(el => {
          const ok = (k === 'all' || el.dataset.f === k || el.dataset.f === 'all') && (!term || norm(el.dataset.s).includes(term));
          el.classList.toggle('hide', !ok); if(ok) h++;
        });
        g.classList.toggle('hide', !h); n += h;
      });
    } else {
      p.querySelectorAll('[data-card]').forEach(card => {
        let h = 0;
        const head = card.querySelector('.row-h').textContent;
        card.querySelectorAll('[data-s]').forEach(el => {
          const ok = !term || norm(el.dataset.s + ' ' + head).includes(term);
          el.classList.toggle('hide', !ok); if(ok) h++;
        });
        card.classList.toggle('hide', !h); n += h;
      });
    }
    p.querySelector('[data-empty]').classList.toggle('hide', n > 0);
    counts[t.id] = n;
    const nEl = document.querySelector(`[data-n="${t.id}"]`);
    nEl.textContent = n;
    nEl.parentElement.classList.toggle('zero', !!term && n === 0);
  });
  if(term && !counts[CUR]){
    const first = TABS.find(t => counts[t.id]);
    if(first) show(first.id, false);
  }
}

function show(id, focus){
  if(!TABS.some(t => t.id === id)) id = 'sites';
  CUR = id;
  TABS.forEach(t => {
    const on = t.id === id;
    const tab = document.getElementById('tab-' + t.id);
    tab.setAttribute('aria-selected', on);
    tab.tabIndex = on ? 0 : -1;
    const p = document.getElementById('p-' + t.id);
    if(on && p.hidden){ p.hidden = false; p.classList.remove('enter'); void p.offsetWidth; p.classList.add('enter'); }
    else if(!on) p.hidden = true;
  });
  if(location.hash !== '#' + id){ try{ history.replaceState(null, '', '#' + id); }catch(e){} }
  const tabEl = document.getElementById('tab-' + id);
  if(focus) tabEl.focus();
  const bar = document.getElementById('tabs');
  const l = tabEl.offsetLeft - bar.offsetLeft, r = l + tabEl.offsetWidth;
  if(l < bar.scrollLeft || r > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = l - 12;
}

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if(t) show(t.dataset.tab, false);
});
document.getElementById('tabs').addEventListener('keydown', e => {
  const i = TABS.findIndex(t => t.id === CUR);
  if(e.key === 'ArrowRight'){ e.preventDefault(); show(TABS[(i+1) % TABS.length].id, true); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); show(TABS[(i-1+TABS.length) % TABS.length].id, true); }
});
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));

document.addEventListener('click', e => {
  const b = e.target.closest('.seg button'); if(!b) return;
  const seg = b.closest('.seg');
  SEG[seg.dataset.seg] = b.dataset.k;
  seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  filter();
});

q.addEventListener('input', filter);
document.getElementById('clear').addEventListener('click', () => { q.value = ''; filter(); q.focus(); });
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape' && document.activeElement === q){ q.value = ''; filter(); }
});

/* ── 주소 복사 ── */
const toast = document.getElementById('toast'); let tt;
function say(m, ok){ toast.innerHTML = (ok ? svg(IC.check, 16, 2.6) : '') + esc(m); toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if(!b) return;
  e.preventDefault();
  const url = b.dataset.copy;
  const what = b.dataset.what === 'code' ? '접근코드를' : '주소를';
  try{ await navigator.clipboard.writeText(url); say(what + ' 복사했습니다', true); }
  catch(err){
    const t = document.createElement('textarea'); t.value = url; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(e2){} t.remove();
    say(ok ? what + ' 복사했습니다' : '복사하지 못했습니다. 길게 눌러 직접 복사해 주세요', ok);
  }
});

show(location.hash.slice(1) || 'sites', false);
filter();
</script>
</body>
